name: Cross-platform CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: cross-platform-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  shared-razor-web:
    name: Shared, Razor and Web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Configure SSH for private submodule
        env:
          SUBMODULE_SSH_KEY: ${{ secrets.SUBMODULE_SSH_KEY }}
          SUBMODULE_KNOWN_HOSTS: ${{ secrets.SUBMODULE_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          if [[ -z "$SUBMODULE_SSH_KEY" || -z "$SUBMODULE_KNOWN_HOSTS" ]]; then
            echo "::error::SUBMODULE_SSH_KEY and SUBMODULE_KNOWN_HOSTS must be configured."
            exit 1
          fi

          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SUBMODULE_SSH_KEY" > "$HOME/.ssh/watermark_submodule_key"
          printf '%s\n' "$SUBMODULE_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/watermark_submodule_key" "$HOME/.ssh/known_hosts"

      - name: Check out Watermark.Shared submodule
        run: |
          set -euo pipefail
          git config --global url."git@github.com:".insteadOf "https://github.com/"
          GIT_SSH_COMMAND="ssh -i $HOME/.ssh/watermark_submodule_key -o BatchMode=yes -o IdentitiesOnly=yes" \
            git submodule update --init --recursive

      - name: Remove private submodule credential
        if: always()
        run: |
          rm -f "$HOME/.ssh/watermark_submodule_key"
          git config --global --unset-all url."git@github.com:".insteadOf || true
      - uses: actions/setup-dotnet@v5
        id: setup-dotnet
        with:
          dotnet-version: 8.0.x
      - name: Pin .NET SDK for this run
        run: >-
          dotnet new globaljson
          --sdk-version "${{ steps.setup-dotnet.outputs.dotnet-version }}"
          --roll-forward latestPatch
          --force
      - name: Repository architecture guards
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)(bin|obj|\.vs|\.idea)/'; then
            echo "Generated or IDE-local files must not be committed."
            exit 1
          fi
          if rg -n '@page\s+"/(preview|design|split)|NavigateTo\("/(preview|design|split)' Watermark.Razor Watermark.Andorid Watermark.Win; then
            echo "A removed creation route was reintroduced."
            exit 1
          fi
          if rg -n '\bMac(EditingSession|WorkspaceCoordinator|RenderPlan|TemplateStore|TemplateEditorState|ControlTree|FullResolutionRenderService|ImageImportService|TemplateLibraryService)\b' Watermark.Razor Watermark.Andorid Watermark.Win; then
            echo "A removed Mac business wrapper was reintroduced."
            exit 1
          fi
      - name: Restore
        run: |
          dotnet restore Watermark.Shared/Tests/Watermark.Shared.Tests.csproj
          dotnet restore Watermark.Razor.Tests/Watermark.Razor.Tests.csproj
          dotnet restore Watermark.Web/Watermark.Web/Watermark.Web.csproj
      - name: Prepare Linux SkiaSharp runtime
        shell: bash
        run: |
          set -euo pipefail

          native_dir="$RUNNER_TEMP/skiasharp"
          package_path="$RUNNER_TEMP/SkiaSharp.NativeAssets.Linux.2.88.9.nupkg"
          mkdir -p "$native_dir"
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
            https://api.nuget.org/v3-flatcontainer/skiasharp.nativeassets.linux/2.88.9/skiasharp.nativeassets.linux.2.88.9.nupkg \
            --output "$package_path"
          unzip -p "$package_path" \
            runtimes/linux-x64/native/libSkiaSharp.so > "$native_dir/libSkiaSharp.so"
          chmod 755 "$native_dir/libSkiaSharp.so"
      - name: Test shared core
        env:
          LD_LIBRARY_PATH: ${{ runner.temp }}/skiasharp
        run: dotnet test Watermark.Shared/Tests/Watermark.Shared.Tests.csproj --configuration Release --no-restore
      - name: Test Razor workspace
        run: dotnet test Watermark.Razor.Tests/Watermark.Razor.Tests.csproj --configuration Release --no-restore
      - name: Compile Web
        run: dotnet build Watermark.Web/Watermark.Web/Watermark.Web.csproj --configuration Release --no-restore

  android:
    name: Android ${{ matrix.configuration }}
    runs-on: macos-14
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v6
      - name: Configure SSH for private submodule
        env:
          SUBMODULE_SSH_KEY: ${{ secrets.SUBMODULE_SSH_KEY }}
          SUBMODULE_KNOWN_HOSTS: ${{ secrets.SUBMODULE_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          if [[ -z "$SUBMODULE_SSH_KEY" || -z "$SUBMODULE_KNOWN_HOSTS" ]]; then
            echo "::error::SUBMODULE_SSH_KEY and SUBMODULE_KNOWN_HOSTS must be configured."
            exit 1
          fi

          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SUBMODULE_SSH_KEY" > "$HOME/.ssh/watermark_submodule_key"
          printf '%s\n' "$SUBMODULE_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/watermark_submodule_key" "$HOME/.ssh/known_hosts"

      - name: Check out Watermark.Shared submodule
        run: |
          set -euo pipefail
          git config --global url."git@github.com:".insteadOf "https://github.com/"
          GIT_SSH_COMMAND="ssh -i $HOME/.ssh/watermark_submodule_key -o BatchMode=yes -o IdentitiesOnly=yes" \
            git submodule update --init --recursive

      - name: Remove private submodule credential
        if: always()
        run: |
          rm -f "$HOME/.ssh/watermark_submodule_key"
          git config --global --unset-all url."git@github.com:".insteadOf || true
      - uses: actions/setup-dotnet@v5
        id: setup-dotnet
        with:
          dotnet-version: 8.0.x
      - name: Pin .NET SDK for this run
        run: >-
          dotnet new globaljson
          --sdk-version "${{ steps.setup-dotnet.outputs.dotnet-version }}"
          --roll-forward latestPatch
          --force
      - name: Use runner Java
        shell: bash
        run: |
          test -n "$JAVA_HOME"
          "$JAVA_HOME/bin/java" -version
      - name: Install Android workload
        run: dotnet workload install maui-android
      - name: Restore Android
        run: |
          dotnet restore Watermark.Andorid/Watermark.Andorid.csproj -p:TargetFramework=net8.0-android
          dotnet restore Watermark.Shared/Watermark.Shared.csproj
          dotnet restore Watermark.Razor/Watermark.Razor.csproj
      - name: Build Android
        run: >-
          dotnet build Watermark.Andorid/Watermark.Andorid.csproj
          --framework net8.0-android
          --configuration ${{ matrix.configuration }}
          --no-restore

  apple:
    name: ${{ matrix.name }} Debug
    runs-on: macos-14
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Mac Catalyst
            framework: net8.0-maccatalyst
            runtime: maccatalyst-arm64
            workload: maui-maccatalyst
            properties: -p:CodesignKey=-
          - name: iOS simulator
            framework: net8.0-ios
            runtime: iossimulator-arm64
            workload: ios
            properties: -p:CodesignKey=-
    steps:
      - uses: actions/checkout@v6
      - name: Configure SSH for private submodule
        env:
          SUBMODULE_SSH_KEY: ${{ secrets.SUBMODULE_SSH_KEY }}
          SUBMODULE_KNOWN_HOSTS: ${{ secrets.SUBMODULE_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          if [[ -z "$SUBMODULE_SSH_KEY" || -z "$SUBMODULE_KNOWN_HOSTS" ]]; then
            echo "::error::SUBMODULE_SSH_KEY and SUBMODULE_KNOWN_HOSTS must be configured."
            exit 1
          fi

          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SUBMODULE_SSH_KEY" > "$HOME/.ssh/watermark_submodule_key"
          printf '%s\n' "$SUBMODULE_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/watermark_submodule_key" "$HOME/.ssh/known_hosts"

      - name: Check out Watermark.Shared submodule
        run: |
          set -euo pipefail
          git config --global url."git@github.com:".insteadOf "https://github.com/"
          GIT_SSH_COMMAND="ssh -i $HOME/.ssh/watermark_submodule_key -o BatchMode=yes -o IdentitiesOnly=yes" \
            git submodule update --init --recursive

      - name: Remove private submodule credential
        if: always()
        run: |
          rm -f "$HOME/.ssh/watermark_submodule_key"
          git config --global --unset-all url."git@github.com:".insteadOf || true
      - uses: actions/setup-dotnet@v5
        id: setup-dotnet
        with:
          dotnet-version: 8.0.x
      - name: Pin .NET SDK for this run
        run: >-
          dotnet new globaljson
          --sdk-version "${{ steps.setup-dotnet.outputs.dotnet-version }}"
          --roll-forward latestPatch
          --force
      - name: Install workload
        run: dotnet workload install ${{ matrix.workload }}
      - name: Restore
        run: |
          dotnet restore Watermark.Andorid/Watermark.Andorid.csproj -p:TargetFramework=${{ matrix.framework }} -p:RuntimeIdentifier=${{ matrix.runtime }}
          dotnet restore Watermark.Shared/Watermark.Shared.csproj
          dotnet restore Watermark.Razor/Watermark.Razor.csproj
      - name: Build
        run: >-
          dotnet build Watermark.Andorid/Watermark.Andorid.csproj
          --framework ${{ matrix.framework }}
          --configuration Debug
          --no-restore
          -p:RuntimeIdentifier=${{ matrix.runtime }}
          ${{ matrix.properties }}

  windows:
    name: Windows Debug
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Configure SSH for private submodule
        shell: bash
        env:
          SUBMODULE_SSH_KEY: ${{ secrets.SUBMODULE_SSH_KEY }}
          SUBMODULE_KNOWN_HOSTS: ${{ secrets.SUBMODULE_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          if [[ -z "$SUBMODULE_SSH_KEY" || -z "$SUBMODULE_KNOWN_HOSTS" ]]; then
            echo "::error::SUBMODULE_SSH_KEY and SUBMODULE_KNOWN_HOSTS must be configured."
            exit 1
          fi

          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SUBMODULE_SSH_KEY" > "$HOME/.ssh/watermark_submodule_key"
          printf '%s\n' "$SUBMODULE_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/watermark_submodule_key" "$HOME/.ssh/known_hosts"

      - name: Check out Watermark.Shared submodule
        shell: bash
        run: |
          set -euo pipefail
          git config --global url."git@github.com:".insteadOf "https://github.com/"
          GIT_SSH_COMMAND="ssh -i $HOME/.ssh/watermark_submodule_key -o BatchMode=yes -o IdentitiesOnly=yes" \
            git submodule update --init --recursive

      - name: Remove private submodule credential
        if: always()
        shell: bash
        run: |
          rm -f "$HOME/.ssh/watermark_submodule_key"
          git config --global --unset-all url."git@github.com:".insteadOf || true
      - uses: actions/setup-dotnet@v5
        id: setup-dotnet
        with:
          dotnet-version: 8.0.x
      - name: Pin .NET SDK for this run
        shell: bash
        run: >-
          dotnet new globaljson
          --sdk-version "${{ steps.setup-dotnet.outputs.dotnet-version }}"
          --roll-forward latestPatch
          --force
      - name: Restore
        run: dotnet restore Watermark.Win/Watermark.Win.csproj
      - name: Build Windows host
        run: dotnet build Watermark.Win/Watermark.Win.csproj --configuration Debug --no-restore
